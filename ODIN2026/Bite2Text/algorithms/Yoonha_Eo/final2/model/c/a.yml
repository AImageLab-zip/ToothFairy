work_dir: /tmp/b2t/logs
version: mixedseg_validate
seed: 0
model:
  instseg:
    channels_list:
    - 48
    - 96
    - 192
    - 256
    depths:
    - 3
    - 9
    - 3
    heads_list:
    - 6
    - 12
    - 24
    window_sizes:
    - 0.4
    - 0.8
    - 1.6
    point_embedding:
      use: true
      kpconv_point_influence: 0.04
      kpconv_ball_radius: 0.1
    stratified_union: false
    downsample_ratio: 0.26
    max_drop_path_prob: 0.3
    stratified_downsample_ratio: 0.26
    crpe_bins: 80
    transformer_lr_ratio: 0.1
    checkpoint_path: /opt/ml/model/w/instseg.ckpt
    lr: 0.0006
    weight_decay: 0.0001
    epochs: 500
    warmup_epochs: 5
  mixedseg:
    channels_list:
    - 48
    - 96
    - 192
    - 256
    depths:
    - 3
    - 9
    - 3
    heads_list:
    - 6
    - 12
    - 24
    window_sizes:
    - 0.4
    - 0.8
    - 1.6
    point_embedding:
      use: true
      kpconv_point_influence: 0.04
      kpconv_ball_radius: 0.1
    stratified_union: false
    downsample_ratio: 0.26
    max_drop_path_prob: 0.3
    stratified_downsample_ratio: 0.26
    crpe_bins: 80
    transformer_lr_ratio: 0.1
    checkpoint_path: /opt/ml/model/w/instseg.ckpt
    lr: 0.0006
    weight_decay: 0.0001
    epochs: 200
    warmup_epochs: 0
  landmarks:
    channels_list:
    - 48
    - 96
    - 192
    - 256
    depths:
    - 3
    - 9
    - 3
    heads_list:
    - 6
    - 12
    - 24
    window_sizes:
    - 0.2
    - 0.4
    - 0.8
    point_embedding:
      use: true
      kpconv_point_influence: 0.02
      kpconv_ball_radius: 0.05
    stratified_union: false
    downsample_ratio: 0.26
    max_drop_path_prob: 0.3
    stratified_downsample_ratio: 0.26
    crpe_bins: 80
    transformer_lr_ratio: 0.1
    checkpoint_path: /opt/ml/model/w/landmarks.ckpt
    lr: 0.0006
    weight_decay: 0.0001
    epochs: 500
    warmup_epochs: 5
  proposal_points: 10000
  dbscan_cfg:
    max_neighbor_dist: 0.03
    min_points: 40
    weighted: true
accumulate_grad_batches: 1
gradient_clip_norm: 35
out_dir: /tmp/b2t/predictions
datamodule:
  root: /tmp/b2t/staging
  landmarks_root: /tmp/b2t/landmarks
  regex_filter: ''
  extensions:
  - ply
  - stl
  - obj
  clean: true
  val_size: 0.2
  include_val_as_train: false
  batch: null
  batch_size: 1
  num_workers: 2
  pin_memory: true
  persistent_workers: false
  uniform_density_voxel_size:
  - 0.025
  - 0.01
  boundary_aware:
    use: false
    voxel_size: 0.01
    sample_ratio: 0.25
  proposal_points: 10000
  max_proposals: 16
  include_cusps: false
  to_left_right: false
  separate_front_posterior: false
  distinguish_upper_lower: false
