[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitemark"
version = "0.1.0"
description = "Legacy Bitemark demo; see submission/ for the final2 AGPL inference release"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Yoonha Eo"}]
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "pillow>=10"]

[project.scripts]
bitemark = "bitemark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["final2", "submission", "training/iop", "training/ios", "training/labels"]
