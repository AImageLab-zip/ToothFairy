# Two-rank DDP variant of the prefix stage — it differs from the single-GPU config in grad_accum
# only (4 -> 2). The effective batch is world_size x batch_size x grad_accum, so 2 ranks x 1 x 2
# = 4, the same as the single-GPU config. Failing to lower this one line would give an effective
# batch of 8 and mix a change of batch size into the DDP comparison.
# The output directory and run_name stay identical to the single-GPU config — DDP is a way of
# computing, not an experiment, and the real rank count is recorded as `ranks` in the
# reproducibility snapshot written into the output directory.
#
# Stage 2 (prefix): perception and LLM frozen, only the soft prefix projector is trained on the
# report loss. The perception network trained in stage 1 is kept frozen, and only the projector
# that maps its representation into the LLM embedding space is learned (the same role as the
# alignment stage in LLaVA). The LLM, LoRA included, is entirely frozen.
#
# No findings head and no soft probability injection: the head belongs to stage 1 only. Claim
# information reaches the LLM solely through the encoder output (ctx), which keeps each stage to
# a single objective. (Keeping the injection with a frozen head would leave the head outputs
# stale once the encoder starts moving in the LLM LoRA stage.)

perception:
  backbone: hybrid
  cache_dir: experiments/feature_cache/region_features_sc
  tf2_teeth_cache_dir: experiments/feature_cache/tf2_tooth_density_sc

encoder:
  pe_k: 6
  d_model: 128
  n_heads: 4
  gate_hidden: 128
  dropout: 0.2
  cl_layers: 2
  cl_heads: 4
  cl_dropout: 0.2
  use_presence_emb: false
  use_in_proj: false

realizer:
  llm_name: Qwen/Qwen3.5-9B
  quant: 4bit
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  n_prefix_per_token: 1
  proj_hidden: 512
  dropout: 0.2
  max_text_len: 512
  grad_checkpointing: true
  use_liger: true

train:
  run_name: sinus_prefix
  seed: 42
  lr: 2.0e-4
  weight_decay: 1.0e-2
  batch_size: 1
  grad_accum: 2                  # 2-rank DDP: world_size(2) x 2 = effective batch 4
  epochs: 40                     # in practice ends on early stopping (patience 5)
  early_stopping_patience: 5

  stage: prefix
  init_from: models/sinus_perception/best.pt   # seed from the perception stage
  region_chunk_size: 8           # decode chunk: bounds memory, loss/gradient unchanged
  best_metric: finding           # best/early-stop on finding-region CE, not diluted by EOS

  # --- ground truth ---
  anat_dir: experiments/extraction/per_structure_per_report_split
  dense_dir: experiments/GT/categorical_GT/per_report

  # --- findings (claim) supervision ---
  # --- no findings head = no gate loss, no soft injection (pure report loss) ---
  findings_head: false
  false_eos_weight_beta: 0.99
  false_eos_lambda: 1.6
  eos_include_not_available: true
  use_siglip: false
