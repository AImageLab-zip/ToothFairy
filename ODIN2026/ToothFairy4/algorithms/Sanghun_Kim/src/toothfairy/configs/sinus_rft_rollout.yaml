# Rollout config — region-level group-relative policy optimisation (GRPO).
#
# Starts from the policy produced by the LLM LoRA stage (supervised QLoRA) and keeps training
# **the LoRA only**, now against a reward.
# Motivation: hallucination (a finding that is not in the GT) is not caught by a token-level
# cross-entropy — this replaces the objective with clinical faithfulness.
#
# WARNING: the perception / encoder / realizer blocks must hold **the same values as the resolved
#    config of the LLM LoRA stage** (a different model structure makes the init_from load fail, or
#    worse, silently produces a different model). The values below are copied from that config.
#
# The `train` block is **not read** by the GRPO loop (only its data-source keys are: anat_dir,
# dense_dir, eos_include_not_available). Optimisation values
# such as lr and epochs live in the `grpo` block.

perception:
  backbone: hybrid
  cache_dir: experiments/feature_cache/region_features_sc
  tf2_teeth_cache_dir: experiments/feature_cache/tf2_tooth_density_sc

encoder:
  pe_k: 6
  d_model: 128
  n_heads: 4
  gate_hidden: 128
  dropout: 0.2                   # forced to 0 during GRPO so the sampled policy == the scored one
  cl_layers: 2
  cl_heads: 4
  cl_dropout: 0.2
  use_presence_emb: false
  use_in_proj: false

realizer:
  llm_name: Qwen/Qwen3.5-9B
  quant: 4bit
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.1              # likewise forced to 0 during GRPO
  n_prefix_per_token: 1
  proj_hidden: 512
  dropout: 0.2                   # likewise forced to 0 during GRPO
  max_text_len: 512
  grad_checkpointing: true
  use_liger: true

train:
  # --- data sources (must match the LLM LoRA stage for the comparison to be fair) ---
  run_name: sinus_rft
  seed: 42
  anat_dir: experiments/extraction/per_structure_per_report_split
  dense_dir: experiments/GT/categorical_GT/per_report
  findings_head: false
  eos_include_not_available: true
  use_siglip: false

grpo:
  run_name: sinus_rft
  seed: 42

  # Starting policy: the checkpoint of the LLM LoRA stage.
  init_from: models/sinus_llm_lora/best.pt

  # --- rollout (8 regions with findings : 4 normal regions) ---
  n_finding_regions: 8
  n_normal_regions: 4
  preserve_ratio_when_short: true   # keep the 2:1 ratio for patients with fewer than 8 findings
  group_size: 6
  temperature: 1.0
  top_p: 1.0                        # fixed at 1.0 — truncating makes the sampling distribution
                                    # differ from the scored one (guarded in grpo.py)
  max_new_tokens: 96
  # No repetition_penalty: if the sampling policy differs from the log-probability policy, the
  # GRPO objective no longer holds.

  # --- optimisation ---
  lr: 1.0e-5
  weight_decay: 0.0
  grad_accum: 1
  max_grad_norm: 1.0
  total_steps: 1000
  advantage_norm: std
  adv_std_eps: 1.0e-4

  # --- KL (reference = a second frozen adapter holding the LLM LoRA weights) ---
  kl_beta: 0.04
  kl_estimator: k3
  kl_delta_clamp: 10.0

  # --- runtime / memory ---
  logprob_micro_batch: 6            # == group_size -> one forward per group (prompt encoded once)

  # --- reward (weighted sum: claim 0.7 + term 0.2 + polarity 0.1, see rl/reward.py) ---
  # Reward reference = the union of all reports of the patient (the same convention as the
  # reference used at evaluation time). With `sampled`, 13.7% of the slots that look normal are
  # in fact findings in another report of the same patient, which suppresses genuine findings.
  reward_gt: union                  # union | sampled (control experiment)
  # A statement that a tooth is present ("Tooth 31 present") may be written or omitted, so it is
  #   neutralised in the scoring. In the GT only 45.5% of the teeth with state=normal have their
  #   presence written out, i.e. the same input carried opposite targets.
  #   Arch-level presence statements ("complete mandibular dentition") are **not** neutralised.
  reward_neutralize_presence: true
  # Once presence statements are removed, regions for which the rule-based extractor produces no
  #   claim at all are excluded from the scoring: there the claim F1 would be empty set vs empty
  #   set = 1.0, i.e. anything said scores full marks.
  #   WARNING: for the non-teeth regions, an empty claim set usually means the text was about the
  #   field of view or was a negative finding, so those regions are not learned during RL.
  reward_drop_claimless: true

  # --- validation reward (greedy) / checkpointing ---
  eval_every: 50
  eval_patients: 8
  eval_patience: 6
  save_every: 25
